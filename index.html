<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-A-Sketch</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="etchASketch.js"></script>
  </head>
  <body>
    <h1>ETCH-A-SKETCH</h1>
    <div class="header">
      <div>
        <!--<button id="new">Grid Size</button>-->
        <button id="reset">Reset grid</button>
      </div>
      <div class="radio">
        <div>Grid Size:</div>
        <input type="radio" id="8" name="grid-size">
        <label for="8">8</label>
        <input type="radio" id="16" name="grid-size" checked>
        <label for="16">16</label>
        <input type="radio" id="32" name="grid-size">
        <label for="32">32</label>
        <input type="radio" id="64" name="grid-size">
        <label for="64">64</label>
      </div>
      <div>
        <div class="check">
          <input type="checkbox" id="random-color" value="random-color">
          <label for="random-color">Randomize colors</label>
        </div>
        <div class="check">
          <input type="checkbox" id="borders" value="borders">
          <label for="borders">Borders</label>
        </div>
      </div>
    </div>

    <div class="container"></div>
  </body>
</html>
